<!--Use document.getElementById("greeting") to select the paragraph.
Change its text by setting .textContent to a message of your choice.-->

<!doctype html>
<html>
  <body>
    <p id="greeting">Hello!</p>

    <script>
      // Select the paragraph and change its text
      document.getElementById("greeting").textContent = "Hello! Aman";
    </script>
  </body>
</html>
