<!--JavaScript should have its own .js file linked with <script src="...".
This is the recommended approach for real projects. It keeps the logic separate from the markup.-->

<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="3.turn-red-mauve.css" />
  </head>
  <body>
    <p id="text">Click the button to change text color.</p>

      <br />

    <script src="3.turn-red-mauve.js"></script>
  </body>
</html>
