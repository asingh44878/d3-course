<!doctype html>
<html>
  <body>
    <p id="text">Click the button to make me blue!</p>
    <button onclick="document.getElementById('text').style.color = 'blue'">
      Turn blue
    </button>
  </body>
</html>

<!--The HTML button element accepts an onclick attribute.
You can provide a JavaScript snippet to this attribute,
and it will be triggered when the user clicks the button.-->

<!--The JavaScript code above selected the HTML element
with the id 'text' using the 'getElementById' function.
Then it changed its style using the CSS color property.-->
