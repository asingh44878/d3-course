<!doctype html>
<html>
  <body>
    <h3>Useful Links</h3>
    <p>Visit <a href="https://google.com">Google</a></p>
    <p>
      Opens in new tab:
      <a href="https://github.com" target="_blank">GitHub</a>
      <!-- Opens in new tab -->
    </p>
    <p>
      <a href="#bottom">Jump to bottom</a>
      <!-- Links to the bottom of the page. Notice the # symbol -->
    </p>

    <div style="height: 200px"></div>
    <p id="bottom">You're at the bottom!</p>
    <!-- Links to the bottom of the page -->
  </body>
</html>
