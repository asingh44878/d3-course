<!--Tables display data in rows and columns. Use them for actual tabular data, not for page layout (that's what CSS is for).-->
<!doctype html>
<html>
  <body>
    <h3>Student Grades</h3>
    <i>This is a table of student grades.</i>
    <table border="1">
      <thead>
        <!--Table header-->
        <tr>
          <!--Table row-->
          <!--Header Cell. Bold and centered by default.-->
          <th>Student ID</th>
          <th>Name</th>
          <th>Subject</th>
          <th>Grade</th>
        </tr>
      </thead>
      <tbody>
        <!--Table body-->
        <tr>
          <!--Table row-->
          <td>001</td>
          <td>Alice</td>
          <!--Table data cell-->
          <td>Math</td>
          <td>A</td>
        </tr>
        <tr>
          <td>002</td>
          <td>Bob</td>
          <td>Science</td>
          <td>B+</td>
        </tr>
        <tr>
          <td>003</td>
          <td>Charlie</td>
          <td>History</td>
          <td>A-</td>
        </tr>
      </tbody>
      <!--Table body close-->
    </table>
    <!--Table close-->
    <p>
      The summarized table of student grades is this. <br />Ha Ha Ha Charlie got
      a C-!
    </p>
  </body>
</html>
