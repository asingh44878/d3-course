<!doctype html>
<html>
  <head>
    <title>My First Website</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  </head>
  <body>
    <h1>Hello World!</h1>
    <p>This is my very first website.</p>

    <svg id="chart" width="400" height="300"></svg>

    <script>
      const data = [
        { name: "A", value: 1 },
        { name: "B", value: 2 },
        { name: "C", value: 3 },
        { name: "D", value: 4 },
      ];

      const width = 400;
      const height = 300;
      const margin = { top: 20, right: 20, bottom: 30, left: 30 };

      const svg = d3.select("#chart");

      // x scale: one band per name, spanning the chart width
      const x = d3
        .scaleBand()
        .domain(data.map((d) => d.name))
        .range([margin.left, width - margin.right])
        .padding(0.1);

      // y scale: value 0 -> max, mapped to height -> 0 (SVG y grows downward)
      const y = d3
        .scaleLinear()
        .domain([0, d3.max(data, (d) => d.value)])
        .range([height - margin.bottom, margin.top]);

      // draw the bars
      svg
        .selectAll("rect")
        .data(data)
        .join("rect")
        .attr("x", (d) => x(d.name))
        .attr("y", (d) => y(d.value))
        .attr("width", x.bandwidth())
        .attr("height", (d) => y(0) - y(d.value))
        .attr("fill", "steelblue");

      // x axis
      svg
        .append("g")
        .attr("transform", `translate(0, ${height - margin.bottom})`)
        .call(d3.axisBottom(x));

      // y axis
      svg
        .append("g")
        .attr("transform", `translate(${margin.left}, 0)`)
        .call(d3.axisLeft(y));
    </script>
  </body>
</html>
