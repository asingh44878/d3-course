<html>
  <body>
    <p>These words have lots of spaces.</p>
    <p>This paragraph has many line breaks.</p>
    <p>But the browser treats them all the same.</p>
    <hr />
    <p>
      Want a real line break? <br />
      Use the <strong>"br"</strong> element
    </p>
  </body>
</html>
