<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="spacing-styles.css" />
  </head>
  <body>
    <div class="margin">
      <p>I have padding inside and margin outside.</p>
    </div>

    <div class="margin">
      <p>Notice the space between us!</p>
    </div>
  </body>
</html>

<!-- You need 2 different <div> even if they have the same class to make 2 different boxes. In this case its "margin".-->
