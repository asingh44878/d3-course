<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="1. styles.css" />
    <!--Link to the stylesheet-->
  </head>
  <body>
    <!--Assigning class p for all p elements.-->
    <p>This paragraph has multiple styles applied.</p>
    <p>My name is Aman Singh.</p>

    <!--Assigning class h to the h6 element.-->
    <h6 class="h">This is a H6 heading.</h6>

    <!--h6 element without any class.-->
    <h6>
      This is a H6 heading without any class assigned, so this will not be
      styled.
    </h6>
  </body>
</html>
